services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clinic_dev
      POSTGRES_PASSWORD: clinic_dev
      POSTGRES_DB: clinic
    ports:
      # Host port 5435 — 5432/5433/5434 are already used by other local projects on this machine.
      - '5435:5432'
    volumes:
      - clinic_postgres_data:/var/lib/postgresql/data

volumes:
  clinic_postgres_data:
