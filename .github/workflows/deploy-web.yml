name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'infra/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '501264525435'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installing from the repo root (not `cd web && npm ci`) matters here —
      # web is an npm workspace member, and installing from inside a member
      # subdirectory reinstalls a smaller, incompletely-hoisted local copy
      # instead of resolving through the root lockfile.
      - name: Install workspace dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint --workspace=web

      # Output lands in web/dist — web-hosting-stack.ts's existsSync guard
      # reads it via a path relative to infra/, so this has to happen before
      # the cdk deploy step below regardless of working directory.
      #
      # These VITE_* values used to come from Vercel's own Production env
      # vars (see git history pre-2026-08-19 cutover) — Vercel silently
      # rebuilt with them server-side on every deploy, masking the fact this
      # step itself never had them. Once dist started going straight to S3,
      # that safety net was gone and every build baked in `undefined`,
      # breaking Cognito init with "Both UserPoolId and ClientId are
      # required." on every page load — not caught because verification
      # only curl'd asset files, never loaded the app in a real browser.
      # Not secrets: the Cognito app client has no client secret, and both
      # IDs end up in the public JS bundle regardless.
      - name: Build web
        env:
          VITE_API_URL: https://api.havenote.health
          VITE_COGNITO_USER_POOL_ID: us-east-1_odhVx41g7
          VITE_COGNITO_CLIENT_ID: 6qut6e3b4gd68it3i28dsqjg6b
        run: npm run build --workspace=web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/clinic-project-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Cut over from the interim Vercel hosting to the real
      # S3+CloudFront+ACM stack 2026-08-19, once the CloudFront
      # account-verification case cleared. BucketDeployment invalidates the
      # distribution's cache as part of the same deploy, so a plain
      # `cdk deploy` here is sufficient — no separate invalidation step.
      - name: Deploy web hosting stack
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: npx cdk deploy ClinicWebHostingStack --require-approval never
