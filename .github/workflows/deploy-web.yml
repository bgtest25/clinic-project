name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installing from the repo root (not `cd web && npm ci`) matters here —
      # web is an npm workspace member, and installing from inside a member
      # subdirectory reinstalls a smaller, incompletely-hoisted local copy
      # instead of resolving through the root lockfile.
      - name: Install workspace dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint --workspace=web

      # Interim substitute for CloudFront (blocked on AWS account
      # verification, see STATUS.md) — deploys to Vercel instead of
      # `cdk deploy ClinicWebHostingStack` (left in place, unused, in
      # web-hosting-stack.ts). Uses Vercel's own documented CI pattern (pull
      # -> build -> deploy --prebuilt) rather than a local build + raw
      # directory deploy — passing a bare directory path straight to `vercel
      # deploy` makes Vercel treat that directory as a brand new project
      # root instead of the already-linked one, which is exactly what
      # happened the first time this was set up manually. VITE_* values live
      # as Vercel Production env vars on the project itself (not secrets:
      # the Cognito app client has no client secret, and both IDs end up in
      # the public JS bundle regardless), so `vercel pull` fetches them
      # automatically — no VITE_* values need to live in this workflow.
      - name: Deploy to Vercel
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
