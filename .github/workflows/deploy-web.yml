name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installing from the repo root (not `cd web && npm ci`) matters here —
      # web is an npm workspace member, and installing from inside a member
      # subdirectory reinstalls a smaller, incompletely-hoisted local copy
      # instead of resolving through the root lockfile.
      - name: Install workspace dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint --workspace=web

      - name: Build web
        run: npm run build --workspace=web

      # Interim substitute for CloudFront (blocked on AWS account
      # verification, see STATUS.md) — deploys to Vercel instead of
      # `cdk deploy ClinicWebHostingStack` (left in place, unused, in
      # web-hosting-stack.ts). Deliberately NOT `vercel build` + `deploy
      # --prebuilt`: that combo hung indefinitely on CI with a freshly
      # fetched CLI (v59) after a working upload, even though the exact same
      # commands succeeded locally seconds earlier — pinning the CLI version
      # and avoiding the prebuilt path sidesteps whatever that was. Also
      # deliberately NOT `vercel deploy dist` (bare positional path) — that
      # makes Vercel treat `dist` as a brand new project root instead of the
      # already-linked one, which is exactly what happened the first time
      # this was set up manually. Copying the pulled `.vercel` link into
      # `dist` first, then deploying from inside it with no positional path,
      # keeps the correct project link and lets Vercel's normal (non-prebuilt)
      # server-side deploy path run, which has been reliable every time.
      # VITE_* values live as Vercel Production env vars on the project
      # itself (not secrets: the Cognito app client has no client secret,
      # and both IDs end up in the public JS bundle regardless), so `vercel
      # pull` fetches them automatically — no VITE_* values need to live in
      # this workflow, though the local build above also picks up its own
      # `web/.env` if one exists.
      - name: Deploy to Vercel
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@50.11.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          cp -r .vercel dist/.vercel
          cd dist
          npx vercel@50.11.0 deploy --prod --yes --token="$VERCEL_TOKEN"
