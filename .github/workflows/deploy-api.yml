name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'infra/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '501264525435'
  ECR_REPOSITORY: clinic-project-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/clinic-project-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          docker build -f api/Dockerfile -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Look up cluster/network details from the compute stack
        id: stack
        run: |
          outputs=$(aws cloudformation describe-stacks --stack-name ClinicComputeStack \
            --query "Stacks[0].Outputs" --output json)
          get() { echo "$outputs" | jq -r ".[] | select(.OutputKey==\"$1\") | .OutputValue"; }
          echo "cluster=$(get ClusterName)" >> "$GITHUB_OUTPUT"
          echo "task_family=$(get TaskDefinitionFamily)" >> "$GITHUB_OUTPUT"
          echo "security_group=$(get AppSecurityGroupId)" >> "$GITHUB_OUTPUT"
          echo "subnets=$(get AppSubnetIds)" >> "$GITHUB_OUTPUT"

      - name: Run database migration
        env:
          CLUSTER: ${{ steps.stack.outputs.cluster }}
          TASK_FAMILY: ${{ steps.stack.outputs.task_family }}
          SUBNETS: ${{ steps.stack.outputs.subnets }}
          SECURITY_GROUP: ${{ steps.stack.outputs.security_group }}
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          # Register a task def revision pointing at the image just built — NOT
          # the currently-deployed revision. `cdk deploy` (which creates the
          # "real" new revision) runs later in this workflow, so migrating
          # against the family name here would silently run against the OLD
          # image and its OLD bundled migrations, reporting false success
          # while never touching the schema this deploy actually needs.
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query "taskDefinition" \
            > current-task-def.json
          jq --arg IMAGE "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            '.containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            current-task-def.json > migration-task-def.json
          migration_task_def_arn=$(aws ecs register-task-definition --cli-input-json file://migration-task-def.json \
            --query "taskDefinition.taskDefinitionArn" --output text)
          echo "Registered migration task def: $migration_task_def_arn"

          task_arn=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$migration_task_def_arn" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"web","command":["npx","prisma","migrate","deploy","--config=api/prisma.config.ts"]}]}' \
            --query "tasks[0].taskArn" --output text)
          echo "Migration task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
            --query "tasks[0].containers[0].exitCode" --output text)
          echo "Migration exit code: $exit_code"
          if [ "$exit_code" != "0" ]; then
            echo "Migration failed — aborting before touching the running service."
            exit 1
          fi

      - name: Install workspace dependencies
        # Installing from the repo root (not `cd infra && npm ci`) matters here —
        # infra is an npm workspace member, and installing from inside a member
        # subdirectory reinstalls a smaller, incompletely-hoisted local copy
        # instead of resolving through the root lockfile the way root-level
        # installs (and the API's own Dockerfile build) correctly do.
        run: npm ci

      - name: Deploy the compute stack with the new image
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ env.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: npx cdk deploy ClinicComputeStack --require-approval never -c apiImageTag=${{ steps.vars.outputs.image_tag }}
